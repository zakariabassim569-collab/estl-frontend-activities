<!DOCTYPE html>
<html>
    <head>
       <meta charset="UTF-8">
       <title>Titre</title>
       <style>
        body {
            background-color: rgb(243, 242, 245);
            text-align : center;
        }
        button {
            padding :10px 20px;
            font-size: 16px;
            background-color:aqua;
            border-radius: 8px;
            color:white;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color:rgb(28, 5, 236);
        }
       </style>
       </head>
       <body>
            <p id="paragraphe" >clickez hnaya !</p>
            <button id ="btn">changer couleur</button>
            <script>
                const paragraphe = document.getElementById("paragraphe");
                const btn = document.getElementById("btn");

                btn.addEventListener("click",()=> { paragraphe.style.color = "red";})
            </script>
       </body>
</html>
